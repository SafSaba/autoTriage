server:
  port: ${PORT:8080}

spring:
  application:
    name: e-automate-shop
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${SPRING_DATASOURCE_USERNAME:shop}
    password: ${SPRING_DATASOURCE_PASSWORD:shop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${APP_JWT_SECRET:autotriage-secret-key-at-least-32-characters-long-2026}
    expiration-ms: 86400000
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://localhost:9002}
  ado:
    organization: ${AZURE_DEVOPS_ORG:isafwan}
    project: ${AZURE_DEVOPS_PROJECT:AutoTriage}
    pat: ${AZURE_DEVOPS_PAT:}
    repo-id: ${AZURE_DEVOPS_REPO_ID:52a5da4c-1581-447b-9d8d-f138fc4096a5}

azure:
  devops:
    org: ${AZURE_DEVOPS_ORG:isafwan}
    project: ${AZURE_DEVOPS_PROJECT:AutoTriage}
    pat: ${AZURE_DEVOPS_PAT:}
    repo-id: ${AZURE_DEVOPS_REPO_ID:52a5da4c-1581-447b-9d8d-f138fc4096a5}
