spring:
  datasource:
    url: jdbc:h2:mem:shoptest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-jwt-secret-key-that-is-at-least-32-bytes-long-for-hmac
    expiration-ms: 3600000
  cors:
    origins: http://localhost:3000
